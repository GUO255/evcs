openapi: 3.1.0
info:
  title: EVCS Auth Service
  version: 0.0.0
  description: 认证服务接口，提供登录页 CSRF、用户名密码注册/登录与健康检查。
servers:
  - url: http://127.0.0.1:3210
tags:
  - name: Auth
paths:
  /health:
    get:
      tags: [Auth]
      summary: 健康检查
      responses:
        "200":
          description: OK
  /platform/device/bootstrap:
    get:
      tags: [Auth]
      summary: 登录设备引导
      responses:
        "200":
          description: OK
  /platform/csrf:
    get:
      tags: [Auth]
      summary: 获取 CSRF Token
      responses:
        "200":
          description: OK
  /platform/credentials/sign-up:
    post:
      tags: [Auth]
      summary: 用户名密码注册
      parameters:
        - name: x-evcs-csrf
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: "^[a-zA-Z0-9_]{3,32}$"
                password:
                  type: string
                  minLength: 6
                  maxLength: 128
      responses:
        "201": { description: 创建成功 }
        "400": { description: 请求参数不合法 }
        "403": { description: CSRF 过期 }
        "409": { description: 用户名已存在 }
  /platform/credentials/sign-in:
    post:
      tags: [Auth]
      summary: 用户名密码登录
      parameters:
        - name: x-evcs-csrf
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: 登录成功，返回平台 Web 地址 }
        "400": { description: 请求参数不合法 }
        "401": { description: 用户名或密码错误 }
        "403": { description: CSRF 过期 }
