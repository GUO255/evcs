services:
  mysql-development:
    image: mysql:8.4
    profiles: [development]
    environment:
      MYSQL_DATABASE: ${EVCS_MYSQL_DATABASE:?EVCS_MYSQL_DATABASE is required}
      MYSQL_USER: ${EVCS_MYSQL_USER:?EVCS_MYSQL_USER is required}
      MYSQL_PASSWORD: ${EVCS_MYSQL_PASSWORD:?EVCS_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${EVCS_MYSQL_ROOT_PASSWORD:?EVCS_MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - evcs_mysql_development_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: ${EVCS_MYSQL_DATABASE:-evcs}
      MYSQL_USER: ${EVCS_MYSQL_USER:?EVCS_MYSQL_USER is required}
      MYSQL_PASSWORD: ${EVCS_MYSQL_PASSWORD:?EVCS_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${EVCS_MYSQL_ROOT_PASSWORD:?EVCS_MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - evcs_mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  evcs_mysql_development_data:
  evcs_mysql_test_data:
