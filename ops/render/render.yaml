# Render Blueprint —— EVCS 全栈部署
# 使用方式：
#   1. 在 Render Dashboard 点 “New +” → “Blueprint”（或上传本文件）
#   2. 选择对应 GitHub 仓库 GUO255/evcs
#   3. 按下方 envVars 提示填写环境变量
#   4. Apply 后会创建 1 个前端 + 4 个后端 Web Service 并自动部署
#
# 注意：Render 免费版无 MySQL 托管，数据库需使用外部免费 MySQL（如 Aiven / PlanetScale），
#      并填充下方 *_URL 环境变量。

services:
  # ---------- 前端 ----------
  - type: web
    name: evcs-platform-web
    runtime: docker
    dockerfilePath: ops/render/web.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    disk:
      name: evcs-web-cache
      mountPath: /tmp
      sizeGB: 1
    envVars:
      - key: BFF_URL
        value: https://evcs-platform-web-bff.onrender.com
      - key: PUBLIC_TIANDITU_TOKEN
        sync: false            # 在 Dashboard 中手动填写
      - key: PUBLIC_AMAP_KEY
        sync: false
      - key: PUBLIC_AMAP_SECURITY_JS_CODE
        sync: false

  # ---------- 后端：platform-web-bff ----------
  - type: web
    name: evcs-platform-web-bff
    runtime: docker
    dockerfilePath: ops/render/service.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    buildArgs:
      - key: APP_NAME
        value: platform-web-bff
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000              # Render 会注入，这里给个默认以免歧义
      - key: AUTH_MYSQL_URL
        sync: false               # 外部 MySQL 连接串
      - key: PLATFORM_WEB_BFF_DATABASE_URL
        sync: false
      - key: BFF_URL
        value: https://evcs-platform-web-bff.onrender.com

  # ---------- 后端：auth-service ----------
  - type: web
    name: evcs-auth-service
    runtime: docker
    dockerfilePath: ops/render/service.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    buildArgs:
      - key: APP_NAME
        value: auth-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10001
      - key: AUTH_MYSQL_URL
        sync: false
      - key: AUTH_PLATFORM_WEB_ORIGIN
        sync: false

  # ---------- 后端：platform-service ----------
  - type: web
    name: evcs-platform-service
    runtime: docker
    dockerfilePath: ops/render/service.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    buildArgs:
      - key: APP_NAME
        value: platform-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10002

  # ---------- 后端：charging-service ----------
  - type: web
    name: evcs-charging-service
    runtime: docker
    dockerfilePath: ops/render/service.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    buildArgs:
      - key: APP_NAME
        value: charging-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10003